<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Bit Track</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            overflow: hidden;
            touch-action: none; 
            font-family: 'Press Start 2P', monospace;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            /* REMOVED the width 100% / height 100% here to prevent the mobile canvas collapse bug */
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;

    // Robust Initialization to completely avoid the mobile grey screen
    function resize() {
        // Includes fallbacks just in case innerWidth isn't ready on page load
        width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    
    // Listen for orientation changes and resize events
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));
    resize(); // Force initial draw sizing

    // Game States: 'MENU', 'PLAYING', 'GAMEOVER'
    let state = 'MENU';
    let selectedEventKey = '100M'; 
    
    // Core Variables
    let speed = 0;
    const maxSpeed = 16;
    let distance = 0;
    let time = 0;
    let resultScore = "";
    
    let lastTapSide = null;
    let activeTouches = { left: false, right: false };
    let touchStartY = 0;
    let actionTriggered = false;
    
    // Physics
    let isJumping = false;
    let jumpY = 0;
    let jumpVy = 0;
    const gravity = 0.6;
    let jumpScore = 0;
    
    // Javelin specific
    let javelinX = 0;
    let javelinY = 0;
    let javelinVy = 0;
    let javelinSpeedX = 0;
    
    // Track visuals
    let trackOffset = 0;
    let frameCount = 0;
    const hurdleDistances = [20, 40, 60, 80];

    // --- Helper Functions ---
    function drawText(text, x, y, size, color = "white", align = "center") {
        ctx.fillStyle = color;
        // Added a monospace fallback so it never crashes if the Google font loads slowly
        ctx.font = `${size}px 'Press Start 2P', monospace`;
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
    }

    function startGame(eventMode) {
        selectedEventKey = eventMode;
        state = 'PLAYING';
        speed = 0;
        distance = 0;
        time = 0;
        resultScore = "";
        lastTapSide = null;
        actionTriggered = false;
        isJumping = false;
        jumpY = 0;
        jumpVy = 0;
        jumpScore = 0;
    }

    function triggerAction() {
        if (selectedEventKey === 'LONG_JUMP' && !actionTriggered && distance < 50) {
            actionTriggered = true;
            isJumping = true;
            jumpVy = -11; 
            jumpScore = speed * 0.6 + (Math.random() * 0.5); 
        }
        if (selectedEventKey === 'JAVELIN' && !actionTriggered && distance < 50) {
            actionTriggered = true;
            javelinX = width * 0.3;
            javelinY = 0; 
            javelinVy = -12;
            javelinSpeedX = speed * 1.5;
            jumpScore = speed * 5.0 + (Math.random() * 2.0);
            speed = 0; 
        }
    }

    // --- Input Listeners ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        
        if (state === 'MENU') {
            let touchY = e.changedTouches[0].clientY;
            let step = height / 4;
            if (touchY < step) startGame('100M');
            else if (touchY < step * 2) startGame('HURDLES');
            else if (touchY < step * 3) startGame('LONG_JUMP');
            else startGame('JAVELIN');
            return;
        }

        if (state === 'GAMEOVER') {
            state = 'MENU';
            return;
        }

        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            touchStartY = t.clientY;
            let side = (t.clientX < width / 2) ? 'left' : 'right';
            activeTouches[side] = true;

            if (selectedEventKey === 'HURDLES' && activeTouches['left'] && activeTouches['right'] && !isJumping) {
                isJumping = true;
                jumpVy = -11;
            } 
            else if (!isJumping && !actionTriggered) {
                if (side !== lastTapSide) {
                    speed += 2.2;
                    if (speed > maxSpeed) speed = maxSpeed;
                    lastTapSide = side;
                }
            }
        }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let t = e.changedTouches[i];
            let side = (t.clientX < width / 2) ? 'left' : 'right';
            activeTouches[side] = false;

            let diffY = touchStartY - t.clientY;
            if (diffY > 40) triggerAction();
        }
    }, { passive: false });


    // --- Game Loop ---
    function update() {
        frameCount++;
        if (state === 'PLAYING') {
            
            if (!actionTriggered || selectedEventKey === 'LONG_JUMP') {
                trackOffset -= speed;
                if (trackOffset <= -40) trackOffset = 0;
            }

            if (isJumping) {
                jumpY += jumpVy;
                jumpVy += gravity;
                if (jumpY >= 0) {
                    jumpY = 0;
                    isJumping = false;
                }
            }

            if (selectedEventKey === '100M') {
                speed *= 0.95; 
                distance += speed * 0.1;
                time += 1 / 60;
                if (distance >= 100) {
                    state = 'GAMEOVER';
                    resultScore = `Time: ${time.toFixed(2)}s`;
                }
            } 
            
            else if (selectedEventKey === 'HURDLES') {
                speed *= 0.95;
                distance += speed * 0.1;
                time += 1 / 60;
                
                hurdleDistances.forEach(h => {
                    if (distance >= h - 0.5 && distance <= h + 0.5 && jumpY > -15) {
                        speed *= 0.4; 
                    }
                });

                if (distance >= 100) {
                    state = 'GAMEOVER';
                    resultScore = `Time: ${time.toFixed(2)}s`;
                }
            }
            
            else if (selectedEventKey === 'LONG_JUMP') {
                if (!actionTriggered) {
                    speed *= 0.96;
                    distance += speed * 0.1;
                    if (distance >= 50) {
                        state = 'GAMEOVER';
                        resultScore = "FOUL!";
                    }
                } else {
                    speed *= 0.98; 
                    distance += speed * 0.1; 
                    if (!isJumping) { 
                        state = 'GAMEOVER';
                        resultScore = `Jumped: ${jumpScore.toFixed(2)}m`;
                    }
                }
            } 
            
            else if (selectedEventKey === 'JAVELIN') {
                if (!actionTriggered) {
                    speed *= 0.96;
                    distance += speed * 0.1;
                    if (distance >= 50) {
                        state = 'GAMEOVER';
                        resultScore = "FOUL!";
                    }
                } else {
                    javelinX += javelinSpeedX;
                    javelinY += javelinVy;
                    javelinVy += gravity;
                    if (javelinY >= 0) {
                        state = 'GAMEOVER';
                        resultScore = `Thrown: ${jumpScore.toFixed(2)}m`;
                    }
                }
            }
        }
    }

    function draw8BitPlayer(px, py) {
        let legOffset = (Math.floor(frameCount / 4) % 2 === 0 && speed > 1 && !isJumping) ? 8 : 0;
        
        ctx.fillStyle = 'white';
        ctx.fillRect(px, py, 20, 28);
        ctx.fillStyle = '#ffcc99'; 
        ctx.fillRect(px + 2, py - 16, 16, 16);
        ctx.fillStyle = 'black'; 
        ctx.fillRect(px, py + 28, 8, 14 + legOffset);
        ctx.fillRect(px + 12, py + 28, 8, 14 - legOffset);
    }

    function draw() {
        ctx.fillStyle = '#33ccff';
        ctx.fillRect(0, 0, width, height);

        let horizonY = height * 0.6;
        ctx.fillStyle = '#c85a17';
        ctx.fillRect(0, horizonY, width, height - horizonY);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.stroke();

        if (state === 'MENU') {
            drawText("8-BIT TRACK", width/2, height * 0.15, 32, "#FFD700");
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(20, height * 0.25 - 40, width - 40, height / 4 - 20);
            ctx.fillRect(20, height * 0.5 - 40, width - 40, height / 4 - 20);
            ctx.fillRect(20, height * 0.75 - 40, width - 40, height / 4 - 20);
            
            drawText("100m Dash", width/2, height * 0.25 - 5, 20);
            drawText("Hurdles", width/2, height * 0.5 - 5, 20);
            drawText("Long Jump", width/2, height * 0.75 - 5, 20);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(20, height - (height/4) + 10, width - 40, height / 4 - 30);
            drawText("Javelin", width/2, height - (height/8) + 10, 20);
        } 
        
        else {
            for (let i = 0; i < width; i += 40) {
                ctx.fillStyle = 'white';
                ctx.fillRect(i + trackOffset, horizonY + 20, 20, 4);
                ctx.fillStyle = '#aa4c13';
                ctx.fillRect(i + trackOffset + 10, horizonY + 50, 20, 4);
            }

            if (selectedEventKey === 'HURDLES') {
                hurdleDistances.forEach(h => {
                    let hx = width * 0.3 + ((h - distance) * 20); 
                    if (hx > -50 && hx < width + 50) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(hx, horizonY + 20, 10, 40); 
                        ctx.fillStyle = 'red';
                        ctx.fillRect(hx - 5, horizonY + 15, 20, 10); 
                    }
                });
            }

            if (selectedEventKey === 'LONG_JUMP' || selectedEventKey === 'JAVELIN') {
                let lineX = width * 0.3 + ((50 - distance) * 20);
                if (lineX < width && lineX > -100) {
                    ctx.fillStyle = 'red';
                    ctx.fillRect(lineX, horizonY, 12, height - horizonY);
                }
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, width, 80);
            
            if (selectedEventKey === '100M' || selectedEventKey === 'HURDLES') {
                drawText(`Dist: ${distance.toFixed(1)}/100m`, 10, 30, 14, "white", "left");
                drawText(`Time: ${time.toFixed(2)}s`, 10, 60, 14, "white", "left");
            } else {
                drawText(`Runway: ${distance.toFixed(1)}/50m`, 10, 30, 14, "white", "left");
                let hint = selectedEventKey === 'LONG_JUMP' ? "Swipe UP to Jump!" : "Swipe UP to Throw!";
                drawText(hint, 10, 60, 14, "yellow", "left");
            }

            drawText(`Spd: ${speed.toFixed(1)}`, width - 10, 30, 14, "white", "right");

            ctx.globalAlpha = 0.15;
            ctx.fillStyle = (lastTapSide === 'right') ? 'white' : 'black';
            ctx.fillRect(0, 80, width / 2, height - 80);
            ctx.fillStyle = (lastTapSide === 'left') ? 'white' : 'black';
            ctx.fillRect(width / 2, 80, width / 2, height - 80);
            ctx.globalAlpha = 1.0;

            if (selectedEventKey === 'JAVELIN' && actionTriggered) {
                ctx.fillStyle = '#DDDDDD';
                ctx.fillRect(javelinX, horizonY - 20 + javelinY, 50, 4);
            }

            draw8BitPlayer(width * 0.3, horizonY - 40 + jumpY);
            
            if (selectedEventKey === 'HURDLES' && !isJumping) {
                drawText("PRESS BOTH THUMBS TO JUMP!", width/2, height * 0.45, 10, "rgba(255, 255, 255, 0.8)");
            }

            if (state === 'GAMEOVER') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, width, height);
                
                let titleColor = resultScore === "FOUL!" ? "#FF0000" : "#00FF00";
                let titleText = resultScore === "FOUL!" ? "FOUL!" : "FINISHED!";
                
                drawText(titleText, width/2, height * 0.4, 30, titleColor);
                if (resultScore !== "FOUL!") {
                    drawText(resultScore, width/2, height * 0.55, 22, "#FFD700");
                }
                
                drawText("- Tap to return to Menu -", width/2, height * 0.8, 12, "#AAAAAA");
            }
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
