<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Bit Track</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            overflow: hidden;
            touch-action: none; 
            font-family: 'Press Start 2P', monospace;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    let state = 'TITLE'; // TITLE, MENU, START_LIGHT, PLAY, GAMEOVER
    let gameMode = '100M'; // '100M' or 'HURDLES'
    
    // Core Game Variables
    let speed = 0; 
    let distance = 0;
    let maxDistance = 100; 
    let time = 0;
    let gameOverDelay = 0;
    
    // High Scores (Loaded from LocalStorage)
    let highScore100m = localStorage.getItem('8bit_track_pb_100m') ? parseFloat(localStorage.getItem('8bit_track_pb_100m')) : null;
    let highScoreHurdles = localStorage.getItem('8bit_track_pb_hurdles') ? parseFloat(localStorage.getItem('8bit_track_pb_hurdles')) : null;

    // Hurdles Specific Variables
    let hurdles = [];
    let jumpHeight = 0;
    let isJumping = false;
    let stumbleTimer = 0;

    // Start Light Variables
    let lightTimer = 0;
    let lightState = 0; // 0: READY, 1: SET, 2: GO!, 3: FALSE START
    
    // Touch & Swipe Mechanics
    let lastSwipeSide = null; 
    let touchStartX = 0;
    let touchStartY = 0;
    
    // Snowflakes background
    let snowflakes = [];
    for(let i = 0; i < 30; i++) {
        snowflakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 2 + 1
        });
    }

    // --- INPUT HANDLING ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        let endX = e.changedTouches[0].clientX;
        let endY = e.changedTouches[0].clientY;
        processInput(touchStartX, touchStartY, endX, endY);
    }, {passive: false});

    // Desktop Mouse (for testing on PC)
    canvas.addEventListener('mousedown', (e) => {
        touchStartX = e.clientX;
        touchStartY = e.clientY;
    });
    canvas.addEventListener('mouseup', (e) => {
        processInput(touchStartX, touchStartY, e.clientX, e.clientY);
    });

    function processInput(startX, startY, endX, endY) {
        if (state === 'TITLE') {
            state = 'MENU';
            return;
        }
        
        if (state === 'MENU') {
            // Check menu box clicks/taps
            // Box 1: 100m Dash (y: 0.3 to 0.42)
            if (startY > height * 0.3 && startY < height * 0.44) {
                gameMode = '100M';
                maxDistance = 100;
                startCountdownSequence();
            }
            // Box 2: Hurdles (y: 0.5 to 0.62)
            else if (startY > height * 0.5 && startY < height * 0.64) {
                gameMode = 'HURDLES';
                maxDistance = 100;
                startCountdownSequence();
            }
            return;
        }
        
        if (state === 'START_LIGHT') {
            if (lightState < 2) {
                lightState = 3; // False Start
                lightTimer = 1.5;
            }
            return;
        }
        
        if (state === 'GAMEOVER') {
            if (gameOverDelay <= 0) {
                state = 'MENU';
            }
            return;
        }

        if (state === 'PLAY') {
            let diffY = endY - startY;
            let diffX = endX - startX;

            // Check for Swipe Up to Jump (specifically in Hurdles mode)
            if (gameMode === 'HURDLES' && diffY < -30 && Math.abs(diffY) > Math.abs(diffX)) {
                if (!isJumping && stumbleTimer <= 0) {
                    isJumping = true;
                    jumpHeight = 1.0; // Trigger jump apex progress
                }
                return;
            }

            // Standard Running Alternate Tap Logic
            if (stumbleTimer <= 0) {
                let side = endX < width / 2 ? 'LEFT' : 'RIGHT';
                if (side !== lastSwipeSide) {
                    speed += 1.3; // Adjusted gain for balanced times
                    if (speed > 11.5) speed = 11.5; // Capped at realistic elite speed (~9.8s theoretical best)
                    lastSwipeSide = side;
                }
            }
        }
    }

    function startCountdownSequence() {
        resetGame();
        state = 'START_LIGHT';
        lightState = 0; 
        lightTimer = 1.0; 
    }

    function resetGame() {
        speed = 0;
        distance = 0;
        time = 0;
        lastSwipeSide = null;
        gameOverDelay = 0;
        jumpHeight = 0;
        isJumping = false;
        stumbleTimer = 0;
        
        // Populate Hurdles if in Hurdles mode (placed every 18 meters)
        hurdles = [];
        if (gameMode === 'HURDLES') {
            for (let d = 18; d < 95; d += 18) {
                hurdles.push({ pos: d, cleared: false });
            }
        }
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();
    
    function loop(currentTime) {
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        
        if (dt > 0.1) dt = 0.1;
        
        update(dt);
        draw();
        
        requestAnimationFrame(loop);
    }

    // --- GAME LOGIC ---
    function update(dt) {
        snowflakes.forEach(flake => {
            flake.y += flake.speed + (speed * 0.2); 
            if (flake.y > height) {
                flake.y = 0;
                flake.x = Math.random() * width;
            }
        });

        if (state === 'START_LIGHT') {
            lightTimer -= dt;
            if (lightTimer <= 0) {
                if (lightState === 0) {
                    lightState = 1; 
                    lightTimer = 1.0;
                } else if (lightState === 1) {
                    lightState = 2; 
                    lightTimer = 0.4;
                } else if (lightState === 2) {
                    state = 'PLAY'; 
                } else if (lightState === 3) {
                    state = 'MENU';
                }
            }
        }

        if (state === 'PLAY') {
            time += dt;

            // Handle Stumble recovery slowdown
            if (stumbleTimer > 0) {
                stumbleTimer -= dt;
                speed = 2.0; // Dragged down speed during recovery
            } else {
                speed -= (speed * 0.88) * dt; 
                if (speed < 0.01) speed = 0;
            }
            
            distance += speed * dt; 

            // Handle Jump arc physics
            if (isJumping) {
                jumpHeight -= dt * 3.5; // Jump duration
                if (jumpHeight <= 0) {
                    jumpHeight = 0;
                    isJumping = false;
                }
            }

            // Hurdle Collision Checks
            if (gameMode === 'HURDLES') {
                hurdles.forEach(h => {
                    if (!h.cleared && Math.abs(distance - h.pos) < 1.5) {
                        if (jumpHeight > 0.2) {
                            h.cleared = true; // Successfully cleared!
                        } else {
                            // Hit the hurdle! Stumble penalty
                            stumbleTimer = 0.8;
                            speed = 0;
                            h.cleared = true;
                        }
                    }
                });
            }
            
            // Win Condition
            if (distance >= maxDistance) {
                distance = maxDistance; 
                state = 'GAMEOVER';
                gameOverDelay = 2.0; 

                // Save High Score based on active game mode
                if (gameMode === '100M') {
                    if (highScore100m === null || time < highScore100m) {
                        highScore100m = time;
                        localStorage.setItem('8bit_track_pb_100m', highScore100m);
                    }
                } else {
                    if (highScoreHurdles === null || time < highScoreHurdles) {
                        highScoreHurdles = time;
                        localStorage.setItem('8bit_track_pb_hurdles', highScoreHurdles);
                    }
                }
            }
        }
        
        if (state === 'GAMEOVER') {
            if (gameOverDelay > 0) {
                gameOverDelay -= dt;
            }
        }
    }

    // --- RENDERING ---
    function drawText(text, x, y, size, color="white", align="center") {
        ctx.fillStyle = color;
        ctx.font = `${size}px 'Press Start 2P', monospace`;
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
    }

    function draw8BitPlayer(cx, cy) {
        // Vertical jump offset if player is airborne
        let jumpOffset = isJumping ? Math.sin(jumpHeight * Math.PI) * 50 : 0;
        let bob = (speed > 0.5 && jumpOffset === 0) ? Math.sin(distance * 5) * (speed * 0.5) : 0;
        
        let renderY = cy - jumpOffset;

        // Shadow stays on ground
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 30, Math.max(5, 20 - jumpOffset*0.2), Math.max(2, 5 - jumpOffset*0.05), 0, 0, Math.PI * 2);
        ctx.fill();

        // Stumble tilt or normal stance
        ctx.save();
        if (stumbleTimer > 0) {
            ctx.translate(cx, renderY);
            ctx.rotate(0.4); // Tilt forward on crash
            ctx.translate(-cx, -renderY);
        }

        ctx.fillStyle = "#FFCCAA"; 
        ctx.fillRect(cx - 12, renderY - 50 + bob, 24, 24); 

        ctx.fillStyle = gameMode === 'HURDLES' ? "#33CC33" : "#FF3333"; // Green jersey for hurdles, Red for dash
        ctx.fillRect(cx - 16, renderY - 25 + bob, 32, 35);

        ctx.fillStyle = "#3333FF"; 
        ctx.fillRect(cx - 16, renderY + 10 + bob, 32, 10);

        let legSwing = speed > 0.5 ? Math.sin(distance * 2) * 15 : 0;
        
        ctx.fillStyle = "#FFCCAA";
        ctx.fillRect(cx - 12, renderY + 20, 10, 15 + legSwing);
        ctx.fillRect(cx + 2, renderY + 20, 10, 15 - legSwing);
        
        ctx.fillStyle = "#EEEEEE";
        ctx.fillRect(cx - 14, renderY + 35 + legSwing, 14, 8);
        ctx.fillRect(cx, renderY + 35 - legSwing, 14, 8);

        ctx.restore();
    }

    function draw() {
        ctx.save();

        if (state === 'PLAY' && speed > 10) {
            let shakeX = (Math.random() - 0.5) * 4;
            let shakeY = (Math.random() - 0.5) * 4;
            ctx.translate(shakeX, shakeY);
        }

        // Environment
        ctx.fillStyle = "#1E3B5C"; 
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        snowflakes.forEach(flake => {
            ctx.fillRect(flake.x, flake.y, flake.size, flake.size);
        });

        ctx.fillStyle = "#B73239";
        ctx.beginPath();
        ctx.moveTo(width * 0.15, 0);
        ctx.lineTo(width * 0.85, 0);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Scrolling Track Lanes
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 4;
        let lineOffset = (distance * 40) % 150;
        
        for(let i = -150; i < height; i += 150) {
            let y = i + lineOffset;
            
            ctx.beginPath();
            let x1 = width * 0.5 - (y / height) * (width * 0.42);
            ctx.moveTo(x1, y);
            ctx.lineTo(x1, y + 60);
            ctx.stroke();

            ctx.beginPath();
            let x2 = width * 0.5 + (y / height) * (width * 0.42);
            ctx.moveTo(x2, y);
            ctx.lineTo(x2, y + 60);
            ctx.stroke();
        }

        // Render Hurdles if in Hurdle mode
        if (gameMode === 'HURDLES') {
            hurdles.forEach(h => {
                let distAhead = h.pos - distance;
                // Only render if close enough on track perspective
                if (distAhead >= -2 && distAhead < 35) {
                    // Map distance ahead to screen Y position
                    let hurdleY = height * 0.7 - (distAhead * 18);
                    let hurdleScale = Math.max(0.2, 1 - (distAhead / 35));
                    
                    if (hurdlesY > 0 && hurdleY < height) {
                        ctx.fillStyle = "#FFFFFF";
                        let hWidth = 80 * hurdleScale;
                        let hHeight = 12 * hurdleScale;
                        ctx.fillRect(width/2 - hWidth/2, hurdleY, hWidth, hHeight);
                        // Hurdle base posts
                        ctx.fillRect(width/2 - hWidth/2, hurdleY, 4 * hurdleScale, 25 * hurdleScale);
                        ctx.fillRect(width/2 + hWidth/2 - 4 * hurdleScale, hurdleY, 4 * hurdleScale, 25 * hurdleScale);
                    }
                }
            });
        }

        // UI & States
        if (state === 'TITLE') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, width, height);
            
            let titleSize = Math.min(width / 14, 40);
            drawText("8-BIT TRACK", width/2, height * 0.4, titleSize, "#FFD700");
            
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                drawText("TAP TO START", width/2, height * 0.65, 16, "#FFFFFF");
            }
        } 
        
        else if (state === 'MENU') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, width, height);
            
            drawText("SELECT EVENT", width/2, height * 0.15, 22, "#FFFFFF");
            
            // Mode 1: 100m Dash Box
            ctx.fillStyle = "#222";
            ctx.fillRect(width * 0.1, height * 0.28, width * 0.8, 75);
            ctx.strokeStyle = "#00FF00";
            ctx.lineWidth = 3;
            ctx.strokeRect(width * 0.1, height * 0.28, width * 0.8, 75);
            drawText("100m Dash", width/2, height * 0.28 + 38, 14, "#00FF00");
            let pb100Str = highScore100m !== null ? `${highScore100m.toFixed(2)}s` : "--.--s";
            drawText(`PB: ${pb100Str}`, width/2, height * 0.28 + 62, 10, "#FFD700");

            // Mode 2: Hurdles Box
            ctx.fillStyle = "#222";
            ctx.fillRect(width * 0.1, height * 0.48, width * 0.8, 75);
            ctx.strokeStyle = "#33CCFF";
            ctx.lineWidth = 3;
            ctx.strokeRect(width * 0.1, height * 0.48, width * 0.8, 75);
            drawText("110m Hurdles", width/2, height * 0.48 + 38, 14, "#33CCFF");
            let pbHurdlesStr = highScoreHurdles !== null ? `${highScoreHurdles.toFixed(2)}s` : "--.--s";
            drawText(`PB: ${pbHurdlesStr}`, width/2, height * 0.48 + 62, 10, "#FFD700");

            drawText("Tap an event box to play", width/2, height * 0.82, 12, "#AAAAAA");
        }

        else if (state === 'START_LIGHT') {
            draw8BitPlayer(width / 2, height * 0.7);

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, width, height);

            if (lightState === 0) {
                drawText("ON YOUR MARKS", width/2, height * 0.4, 20, "#FFA500");
            } else if (lightState === 1) {
                drawText("GET SET", width/2, height * 0.4, 24, "#FFFF00");
            } else if (lightState === 2) {
                drawText("GO!", width/2, height * 0.4, 40, "#00FF00");
            } else if (lightState === 3) {
                drawText("FALSE START!", width/2, height * 0.4, 20, "#FF0000");
                drawText("Wait for GO!", width/2, height * 0.5, 14, "#FFFFFF");
            }
        }
        
        else if (state === 'PLAY') {
            draw8BitPlayer(width / 2, height * 0.7);

            drawText(`DIST: ${Math.floor(distance)}m / ${maxDistance}m`, 15, 30, 12, "#FFF", "left");
            drawText(`TIME: ${time.toFixed(2)}s`, 15, 60, 12, "#FFF", "left");
            if (gameMode === 'HURDLES') {
                drawText(`HURDLES EVENT`, width - 15, 30, 10, "#33CCFF", "right");
            }

            // Stumble warning overlay
            if (stumbleTimer > 0) {
                drawText("STUMBLED!", width/2, height * 0.35, 18, "#FF0000");
            }

            ctx.fillStyle = "#333";
            let barWidth = Math.min(width * 0.4, 200);
            ctx.fillRect(width/2 - barWidth/2, 20, barWidth, 15);
            
            ctx.fillStyle = speed > 10 ? "#FF0000" : "#00FF00";
            ctx.fillRect(width/2 - barWidth/2, 20, (speed / 11.5) * barWidth, 15);
            ctx.strokeStyle = "#FFF";
            ctx.strokeRect(width/2 - barWidth/2, 20, barWidth, 15);

            if (speed < 1 && distance < 5) {
                drawText("ALT TAP TO RUN", width/2, height * 0.42, 12, "rgba(255, 255, 0, 0.9)");
                if (gameMode === 'HURDLES') {
                    drawText("SWIPE UP TO JUMP!", width/2, height * 0.47, 12, "rgba(51, 204, 255, 0.9)");
                }
            }
        } 
        
        else if (state === 'GAMEOVER') {
            draw8BitPlayer(width / 2, height * 0.7); 
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, width, height);
            
            drawText("FINISH!", width/2, height * 0.3, 35, "#00FF00");
            drawText(`Final Time:`, width/2, height * 0.44, 16, "#FFF");
            drawText(`${time.toFixed(2)}s`, width/2, height * 0.52, 26, "#FFD700");

            let currentPB = gameMode === '100M' ? highScore100m : highScoreHurdles;
            if (currentPB !== null && Math.abs(time - currentPB) < 0.001) {
                drawText("NEW PERSONAL BEST!", width/2, height * 0.63, 12, "#00FFFF");
            }
            
            if (gameOverDelay <= 0) {
                drawText("Tap to return to Menu", width/2, height * 0.8, 12, "#AAAAAA");
            }
        }

        ctx.restore();
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
