<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Bit Track</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            overflow: hidden;
            touch-action: none; 
            font-family: 'Press Start 2P', monospace;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    let state = 'TITLE'; // TITLE, MENU, START_LIGHT, PLAY, GAMEOVER
    
    // Core Game Variables
    let speed = 0; 
    let distance = 0;
    let maxDistance = 100; 
    let time = 0;
    let gameOverDelay = 0;
    
    // High Score System (Loaded from LocalStorage)
    let highScore = localStorage.getItem('8bit_track_highscore') ? parseFloat(localStorage.getItem('8bit_track_highscore')) : null;

    // Start Light Variables
    let lightTimer = 0;
    let lightState = 0; // 0: "READY", 1: "SET", 2: "GO!", 3: "FALSE START"
    
    // Tap Mechanics & Snowflake Particles
    let lastSwipeSide = null; 
    let snowflakes = [];

    // Initialize background snowflakes
    for(let i = 0; i < 30; i++) {
        snowflakes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 2 + 1
        });
    }

    // --- INPUT HANDLING ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        processInput(e.changedTouches[0].clientX);
    }, {passive: false});

    canvas.addEventListener('mousedown', (e) => {
        processInput(e.clientX);
    });

    function processInput(x) {
        if (state === 'TITLE') {
            state = 'MENU';
            return;
        }
        
        if (state === 'MENU') {
            startCountdownSequence();
            return;
        }
        
        if (state === 'START_LIGHT') {
            // Tapping before GO! causes a False Start
            if (lightState < 2) {
                lightState = 3; // False Start state
                lightTimer = 1.5; // Display penalty message for 1.5s
            }
            return;
        }
        
        if (state === 'GAMEOVER') {
            if (gameOverDelay <= 0) {
                state = 'MENU';
            }
            return;
        }

        if (state === 'PLAY') {
            let side = x < width / 2 ? 'LEFT' : 'RIGHT';
            
            if (side !== lastSwipeSide) {
                speed += 1.5; 
                if (speed > 12.5) speed = 12.5; 
                lastSwipeSide = side;
            }
        }
    }

    function startCountdownSequence() {
        resetGame();
        state = 'START_LIGHT';
        lightState = 0; // READY
        lightTimer = 1.0; // 1 second per light phase
    }

    function resetGame() {
        speed = 0;
        distance = 0;
        time = 0;
        lastSwipeSide = null;
        gameOverDelay = 0;
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();
    
    function loop(currentTime) {
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        
        if (dt > 0.1) dt = 0.1;
        
        update(dt);
        draw();
        
        requestAnimationFrame(loop);
    }

    // --- GAME LOGIC ---
    function update(dt) {
        // Update Snowflakes background animation
        snowflakes.forEach(flake => {
            flake.y += flake.speed + (speed * 0.2); // Snow moves faster as player runs
            if (flake.y > height) {
                flake.y = 0;
                flake.x = Math.random() * width;
            }
        });

        if (state === 'START_LIGHT') {
            lightTimer -= dt;
            if (lightTimer <= 0) {
                if (lightState === 0) {
                    lightState = 1; // SET
                    lightTimer = 1.0;
                } else if (lightState === 1) {
                    lightState = 2; // GO!
                    lightTimer = 0.4;
                } else if (lightState === 2) {
                    state = 'PLAY'; // Transition to active running
                } else if (lightState === 3) {
                    // Return to menu after false start penalty
                    state = 'MENU';
                }
            }
        }

        if (state === 'PLAY') {
            time += dt;
            distance += speed * dt; 
            
            speed -= (speed * 0.85) * dt; 
            if (speed < 0.01) speed = 0;
            
            // Win Condition
            if (distance >= maxDistance) {
                distance = maxDistance; 
                state = 'GAMEOVER';
                gameOverDelay = 2.0; 

                // Check and Save High Score
                if (highScore === null || time < highScore) {
                    highScore = time;
                    localStorage.setItem('8bit_track_highscore', highScore);
                }
            }
        }
        
        if (state === 'GAMEOVER') {
            if (gameOverDelay > 0) {
                gameOverDelay -= dt;
            }
        }
    }

    // --- RENDERING ---
    function drawText(text, x, y, size, color="white", align="center") {
        ctx.fillStyle = color;
        ctx.font = `${size}px 'Press Start 2P', monospace`;
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
    }

    function draw8BitPlayer(cx, cy) {
        let bob = speed > 0.5 ? Math.sin(distance * 5) * (speed * 0.5) : 0;
        
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 30, 20, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#FFCCAA"; 
        ctx.fillRect(cx - 12, cy - 50 + bob, 24, 24); 

        ctx.fillStyle = "#FF3333"; 
        ctx.fillRect(cx - 16, cy - 25 + bob, 32, 35);

        ctx.fillStyle = "#3333FF"; 
        ctx.fillRect(cx - 16, cy + 10 + bob, 32, 10);

        let legSwing = speed > 0.5 ? Math.sin(distance * 2) * 15 : 0;
        
        ctx.fillStyle = "#FFCCAA";
        ctx.fillRect(cx - 12, cy + 20, 10, 15 + legSwing);
        ctx.fillRect(cx + 2, cy + 20, 10, 15 - legSwing);
        
        ctx.fillStyle = "#EEEEEE";
        ctx.fillRect(cx - 14, cy + 35 + legSwing, 14, 8);
        ctx.fillRect(cx, cy + 35 - legSwing, 14, 8);
    }

    function draw() {
        ctx.save();

        // Camera Shake effect when running over 10 m/s
        if (state === 'PLAY' && speed > 10) {
            let shakeX = (Math.random() - 0.5) * 4;
            let shakeY = (Math.random() - 0.5) * 4;
            ctx.translate(shakeX, shakeY);
        }

        // 1. Draw Environment (Frozen Tundra Track)
        ctx.fillStyle = "#1E3B5C"; // Deep winter ice-blue background
        ctx.fillRect(0, 0, width, height);

        // Render Snowflakes (Iced Ether theme)
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        snowflakes.forEach(flake => {
            ctx.fillRect(flake.x, flake.y, flake.size, flake.size);
        });

        // Red Track
        ctx.fillStyle = "#B73239";
        ctx.beginPath();
        ctx.moveTo(width * 0.15, 0);
        ctx.lineTo(width * 0.85, 0);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Scrolling Track Lanes
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 4;
        let lineOffset = (distance * 40) % 150;
        
        for(let i = -150; i < height; i += 150) {
            let y = i + lineOffset;
            
            ctx.beginPath();
            let x1 = width * 0.5 - (y / height) * (width * 0.42);
            ctx.moveTo(x1, y);
            ctx.lineTo(x1, y + 60);
            ctx.stroke();

            ctx.beginPath();
            let x2 = width * 0.5 + (y / height) * (width * 0.42);
            ctx.moveTo(x2, y);
            ctx.lineTo(x2, y + 60);
            ctx.stroke();
        }

        // 2. Draw UI & States
        if (state === 'TITLE') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, width, height);
            
            let titleSize = Math.min(width / 14, 40);
            drawText("8-BIT TRACK", width/2, height * 0.4, titleSize, "#FFD700");
            
            if (Math.floor(Date.now() / 500) % 2 === 0) {
                drawText("TAP TO START", width/2, height * 0.65, 16, "#FFFFFF");
            }
        } 
        
        else if (state === 'MENU') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, width, height);
            
            drawText("GAME MODES", width/2, height * 0.2, 24, "#FFFFFF");
            
            // Mode 1: 100m Dash
            ctx.fillStyle = "#222";
            ctx.fillRect(width * 0.1, height * 0.3, width * 0.8, 80);
            ctx.strokeStyle = "#00FF00";
            ctx.lineWidth = 3;
            ctx.strokeRect(width * 0.1, height * 0.3, width * 0.8, 80);
            drawText("100m Dash", width/2, height * 0.3 + 48, 16, "#00FF00");

            // Display Personal Best High Score on Menu
            if (highScore !== null) {
                drawText(`PB: ${highScore.toFixed(2)}s`, width/2, height * 0.47, 12, "#FFD700");
            } else {
                drawText(`PB: --.--s`, width/2, height * 0.47, 12, "#888888");
            }

            // Mode 2: Coming Soon
            ctx.fillStyle = "#111";
            ctx.fillRect(width * 0.1, height * 0.55, width * 0.8, 80);
            drawText("Long Jump", width/2, height * 0.55 + 38, 16, "#555555");
            drawText("(Coming Soon)", width/2, height * 0.55 + 60, 10, "#555555");
            
            drawText("Tap anywhere to Play 100m", width/2, height * 0.85, 12, "#AAAAAA");
        }

        else if (state === 'START_LIGHT') {
            draw8BitPlayer(width / 2, height * 0.7);

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, width, height);

            if (lightState === 0) {
                drawText("ON YOUR MARKS", width/2, height * 0.4, 20, "#FFA500");
            } else if (lightState === 1) {
                drawText("GET SET", width/2, height * 0.4, 24, "#FFFF00");
            } else if (lightState === 2) {
                drawText("GO!", width/2, height * 0.4, 40, "#00FF00");
            } else if (lightState === 3) {
                drawText("FALSE START!", width/2, height * 0.4, 20, "#FF0000");
                drawText("Wait for GO!", width/2, height * 0.5, 14, "#FFFFFF");
            }
        }
        
        else if (state === 'PLAY') {
            draw8BitPlayer(width / 2, height * 0.7);

            drawText(`DIST: ${Math.floor(distance)}m / ${maxDistance}m`, 15, 30, 12, "#FFF", "left");
            drawText(`TIME: ${time.toFixed(2)}s`, 15, 60, 12, "#FFF", "left");

            ctx.fillStyle = "#333";
            let barWidth = Math.min(width * 0.4, 200);
            ctx.fillRect(width/2 - barWidth/2, 20, barWidth, 15);
            
            ctx.fillStyle = speed > 10.5 ? "#FF0000" : "#00FF00";
            ctx.fillRect(width/2 - barWidth/2, 20, (speed / 12.5) * barWidth, 15);
            ctx.strokeStyle = "#FFF";
            ctx.strokeRect(width/2 - barWidth/2, 20, barWidth, 15);

            if (speed < 1 && distance < 5) {
                drawText("TAP LEFT", width*0.25, height/2, 12, "rgba(255, 255, 0, 0.8)");
                drawText("TAP RIGHT", width*0.75, height/2, 12, "rgba(255, 255, 0, 0.8)");
                drawText("ALTERNATE THUMBS!", width/2, height/2 + 40, 14, "#FFF");
            }
        } 
        
        else if (state === 'GAMEOVER') {
            draw8BitPlayer(width / 2, height * 0.7); 
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, width, height);
            
            drawText("FINISH!", width/2, height * 0.3, 35, "#00FF00");
            drawText(`Final Time:`, width/2, height * 0.44, 16, "#FFF");
            drawText(`${time.toFixed(2)}s`, width/2, height * 0.52, 26, "#FFD700");

            if (highScore !== null && Math.abs(time - highScore) < 0.001) {
                drawText("NEW PERSONAL BEST!", width/2, height * 0.63, 12, "#00FFFF");
            }
            
            if (gameOverDelay <= 0) {
                drawText("Tap to return to Menu", width/2, height * 0.8, 12, "#AAAAAA");
            }
        }

        ctx.restore();
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
