<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Bit Track & Field - Master Build</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: #1a1a1a;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive Proportional Scaling for Mobile and Desktop
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / 480, window.innerHeight / 320);
            canvas.style.width = (480 * scale) + 'px';
            canvas.style.height = (320 * scale) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game Hub State Engine
        let gameState = 'TITLE'; // 'TITLE', 'MENU', 'PLAYING', 'GAMEOVER'
        let menuSelection = 0;

        const gameModes = [
            { id: '100m', name: '100M DASH', target: 100, desc: 'Alternate thumbs to hit top speed!' },
            { id: 'longjump', name: 'LONG JUMP', target: 70, desc: 'Build speed and time your launch!' },
            { id: 'javelin', name: 'JAVELIN', target: 85, desc: 'Sprint, angle, and throw for distance!' }
        ];

        // Active Event State
        let currentEvent = null;
        let player = {
            x: 40,
            y: 220,
            speed: 0,
            maxSpeed: 14,
            distance: 0,
            targetDistance: 100,
            state: 'running', // 'running', 'jumping', 'throwing', 'finished'
            jumpHeight: 0,
            jumpVelocity: 0,
            throwAngle: 45,
            resultRecorded: false
        };

        let lastTouchSide = null;

        function startEvent(mode) {
            currentEvent = mode;
            player.distance = 0;
            player.speed = 0;
            player.targetDistance = mode.target;
            player.x = 40;
            player.jumpHeight = 0;
            player.jumpVelocity = 0;
            player.state = 'running';
            player.resultRecorded = false;
            lastTouchSide = null;
            gameState = 'PLAYING';
        }

        // --- INPUT PROCESSING ---
        function handleInput(xCoord) {
            if (gameState === 'TITLE') {
                gameState = 'MENU';
                return;
            }

            if (gameState === 'MENU') {
                const screenMid = canvas.clientWidth / 2;
                if (xCoord < screenMid) {
                    menuSelection = (menuSelection - 1 + gameModes.length) % gameModes.length;
                } else {
                    menuSelection = (menuSelection + 1) % gameModes.length;
                }
                return;
            }

            if (gameState === 'PLAYING') {
                const screenMid = canvas.clientWidth / 2;
                const side = xCoord < screenMid ? 'left' : 'right';

                if (player.state === 'running') {
                    // Alternating thumb requirement for maximum acceleration
                    if (side !== lastTouchSide) {
                        player.speed += 1.6;
                        if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
                        lastTouchSide = side;
                    }
                } else if (player.state === 'jumping' || player.state === 'throwing') {
                    // Action triggers for specific events
                    if (currentEvent.id === 'longjump' && player.jumpHeight === 0) {
                        player.jumpVelocity = 8.5;
                    } else if (currentEvent.id === 'javelin' && player.state === 'throwing') {
                        player.state = 'finished';
                        gameState = 'GAMEOVER';
                    }
                }
            }

            if (gameState === 'GAMEOVER') {
                gameState = 'MENU';
            }
        }

        // Touch & Click Event Listeners
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.changedTouches[i].clientX - rect.left;
                handleInput(touchX);
            }
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            handleInput(clickX);
        });

        // Desktop Keyboard Fallbacks
        window.addEventListener('keydown', (e) => {
            if (gameState === 'TITLE') {
                gameState = 'MENU';
            } else if (gameState === 'MENU') {
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    menuSelection = (menuSelection - 1 + gameModes.length) % gameModes.length;
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    menuSelection = (menuSelection + 1) % gameModes.length;
                } else if (e.key === 'Enter' || e.key === ' ') {
                    startEvent(gameModes[menuSelection]);
                }
            } else if (gameState === 'PLAYING') {
                if (e.key === 'a' || e.key === 'ArrowLeft') {
                    if (lastTouchSide !== 'left') {
                        player.speed += 1.6;
                        if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
                        lastTouchSide = 'left';
                    }
                } else if (e.key === 'd' || e.key === 'ArrowRight') {
                    if (lastTouchSide !== 'right') {
                        player.speed += 1.6;
                        if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
                        lastTouchSide = 'right';
                    }
                } else if (e.key === ' ' && currentEvent.id === 'longjump' && player.jumpHeight === 0) {
                    player.jumpVelocity = 8.5;
                }
            } else if (gameState === 'GAMEOVER') {
                gameState = 'MENU';
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- GAME ENGINE UPDATE LOOP ---
        function update() {
            if (gameState === 'PLAYING') {
                player.speed *= 0.93; // Natural track friction
                player.distance += player.speed * 0.04;

                // Event-specific logic paths
                if (currentEvent.id === 'longjump') {
                    if (player.jumpVelocity !== 0 || player.jumpHeight > 0) {
                        player.jumpHeight += player.jumpVelocity;
                        player.jumpVelocity -= 0.6; // Gravity
                        if (player.jumpHeight <= 0) {
                            player.jumpHeight = 0;
                            player.jumpVelocity = 0;
                            if (player.distance >= player.targetDistance) gameState = 'GAMEOVER';
                        }
                    } else if (player.distance >= player.targetDistance - 15) {
                        // Auto jump zone trigger if player reaches end of runway
                        player.jumpVelocity = 8.5;
                    }
                } else if (currentEvent.id === 'javelin') {
                    if (player.distance >= player.targetDistance && player.state === 'running') {
                        player.state = 'throwing';
                    }
                }

                if (player.distance >= player.targetDistance && currentEvent.id !== 'longjump') {
                    player.distance = player.targetDistance;
                    gameState = 'GAMEOVER';
                }
            }
        }

        // --- RENDER GRAPHICS LOOP ---
        function draw() {
            // Sky background
            ctx.fillStyle = '#2266bb';
            ctx.fillRect(0, 0, 480, 320);

            if (gameState === 'TITLE') {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, 480, 320);

                ctx.fillStyle = '#ffcc00';
                ctx.font = '24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('8-BIT TRACK & FIELD', 240, 95);

                ctx.fillStyle = '#00ffcc';
                ctx.font = '11px "Courier New", monospace';
                ctx.fillText('ICED ETHER ECOSYSTEM HUB', 240, 125);

                ctx.fillStyle = '#ffffff';
                ctx.font = '13px "Courier New", monospace';
                ctx.fillText('TAP OR PRESS ANY KEY TO START', 240, 215);
            }
            else if (gameState === 'MENU') {
                ctx.fillStyle = '#121212';
                ctx.fillRect(0, 0, 480, 320);

                ctx.fillStyle = '#ffcc00';
                ctx.font = '20px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SELECT EVENT MODE', 240, 45);

                ctx.fillStyle = '#777';
                ctx.font = '10px "Courier New", monospace';
                ctx.fillText('Tap Left/Right sides to browse, Center to select', 240, 68);

                gameModes.forEach((mode, index) => {
                    let y = 110 + (index * 65);
                    if (index === menuSelection) {
                        ctx.fillStyle = '#ff3333';
                        ctx.fillRect(60, y - 20, 360, 46);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(60, y - 20, 360, 46);
                        ctx.fillStyle = '#ffffff';
                    } else {
                        ctx.fillStyle = '#222';
                        ctx.fillRect(60, y - 20, 360, 46);
                        ctx.fillStyle = '#888';
                    }
                    ctx.font = '15px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(mode.name, 240, y + 2);

                    ctx.font = '10px "Courier New", monospace';
                    ctx.fillStyle = index === menuSelection ? '#ffee00' : '#555';
                    ctx.fillText(mode.desc, 240, y + 18);
                });
            }
            else if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                // Stadium Field & Track
                ctx.fillStyle = '#228833';
                ctx.fillRect(0, 170, 480, 150);

                ctx.fillStyle = '#884422'; // Running Track Surface
                ctx.fillRect(0, 190, 480, 110);

                // Track Lane Stripes
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 220); ctx.lineTo(480, 220);
                ctx.moveTo(0, 260); ctx.lineTo(480, 260);
                ctx.stroke();

                // Draw Runner Sprite (8-Bit Style Box representation)
                ctx.fillStyle = '#ff3333';
                let renderX = 50 + (player.distance / player.targetDistance) * 340;
                let renderY = 230 - player.jumpHeight;
                ctx.fillRect(renderX, renderY, 14, 22);

                // HUD Display Overlay
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(10, 10, 460, 45);

                ctx.fillStyle = '#ffffff';
                ctx.font = '11px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`EVENT: ${currentEvent.name}`, 20, 28);
                ctx.fillText(`SPEED: ${(player.speed * 10).toFixed(0)} KM/H`, 20, 44);
                ctx.fillText(`DIST: ${player.distance.toFixed(1)} / ${player.targetDistance}M`, 260, 28);

                if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(0, 0, 480, 320);

                    ctx.fillStyle = '#00ffcc';
                    ctx.font = '22px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('EVENT COMPLETE!', 240, 130);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '13px "Courier New", monospace';
                    ctx.fillText(`FINAL SCORE: ${player.distance.toFixed(2)}M`, 240, 170);

                    ctx.fillStyle = '#ffcc00';
                    ctx.font = '11px "Courier New", monospace';
                    ctx.fillText('TAP ANYWHERE TO RETURN TO MENU', 240, 220);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.onload = () => {
            loop();
        };
    </script>
</body>
</html>
