<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Bit Track & Field</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Handle high-DPI screens for crisp mobile rendering
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / 480, window.innerHeight / 320);
            canvas.style.width = (480 * scale) + 'px';
            canvas.style.height = (320 * scale) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game States: 'MENU', 'PLAYING', 'GAMEOVER'
        let gameState = 'MENU';
        let currentEvent = '100m';

        // Player Stats
        let player = {
            x: 50,
            y: 220,
            speed: 0,
            maxSpeed: 10,
            distance: 0,
            targetDistance: 100
        };

        // Input tracking for alternating touch
        let lastTouchSide = null;

        function handleTouch(xCoord) {
            if (gameState !== 'PLAYING') return;
            
            const screenMid = canvas.clientWidth / 2;
            const side = xCoord < screenMid ? 'left' : 'right';

            // Require alternating sides
            if (side !== lastTouchSide) {
                player.speed += 1.2;
                if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
                lastTouchSide = side;
            }
        }

        // Event Listeners with mobile optimization
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.changedTouches[i].clientX - rect.left;
                
                if (gameState === 'MENU') {
                    // Simple click to start for mobile testing
                    gameState = 'PLAYING';
                } else {
                    handleTouch(touchX);
                }
            }
        }, { passive: false });

        canvas.addEventListener('click', (e) => {
            if (gameState === 'MENU') {
                gameState = 'PLAYING';
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // Game Loop
        function update() {
            if (gameState === 'PLAYING') {
                // Friction decay
                player.speed *= 0.95;
                player.distance += player.speed * 0.05;

                if (player.distance >= player.targetDistance) {
                    gameState = 'GAMEOVER';
                }
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = '#3388ff'; // Sky
            ctx.fillRect(0, 0, canvas.0Width || 480, 320);

            if (gameState === 'MENU') {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, 480, 320);

                ctx.fillStyle = '#ffcc00';
                ctx.font = '24px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('8-BIT TRACK', 240, 100);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText('TAP SCREEN TO START', 240, 180);
                ctx.fillText('MOBILE GAME HUB EDITION', 240, 220);
            } 
            else if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                // Track Grass
                ctx.fillStyle = '#228833';
                ctx.fillRect(0, 180, 480, 140);

                // Track Lines
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 210); ctx.lineTo(480, 210);
                ctx.moveTo(0, 250); ctx.lineTo(480, 250);
                ctx.moveTo(0, 290); ctx.lineTo(480, 290);
                ctx.stroke();

                // Draw Runner (Retro Block Style)
                ctx.fillStyle = '#ff3333';
                let runnerX = 60 + (player.distance / player.targetDistance) * 350;
                ctx.fillRect(runnerX, 225, 16, 24);

                // HUD / Stats
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`SPEED: ${(player.speed * 10).toFixed(0)} KM/H`, 20, 30);
                ctx.fillText(`DIST: ${player.distance.toFixed(1)} / ${player.targetDistance}M`, 20, 50);

                if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, 480, 320);
                    ctx.fillStyle = '#00ffcc';
                    ctx.font = '20px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('FINISH!', 240, 150);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px "Courier New", monospace';
                    ctx.fillText('TAP TO RESTART', 240, 190);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize loop once window loads
        window.onload = () => {
            loop();
        };
    </script>
</body>
</html>
