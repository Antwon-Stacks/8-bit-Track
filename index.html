<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Bit Track</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            overflow: hidden;
            touch-action: none; /* Crucial to prevent browser swipes refreshing the page */
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Robust initialization to prevent the grey screen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize(); // Initial sizing

        // Game State Variables
        let gameState = 0; // 0: Title, 1: Menu, 2: 100m, 3: Long Jump, 4: Javelin
        let speed = 0;
        const maxSpeed = 16;
        let distance = 0;
        let runTimer = 0;
        let gameOver = false;
        let resultScore = "";
        
        let lastTapSide = null;
        let actionTriggered = false;
        
        // Physics variables for events
        let jumpY = 0;
        let jumpVy = 0;
        let gravity = 0.6;
        let jumpScore = 0;
        
        let javelinX = 0;
        let javelinY = 0;
        let javelinVy = 0;
        let javelinSpeedX = 0;

        let trackOffset = 0;
        let frameCount = 0;

        function startGame(mode) {
            gameState = mode;
            speed = 0;
            distance = 0;
            runTimer = 0;
            gameOver = false;
            resultScore = "";
            lastTapSide = null;
            actionTriggered = false;
            jumpY = 0;
            jumpVy = 0;
            jumpScore = 0;
        }

        // Input Handling
        let touchStartY = 0;

        function handleTap(x, y) {
            if (gameState === 0) {
                gameState = 1; // Go to menu
                return;
            }
            if (gameState === 1) {
                // Menu selection based on screen thirds
                if (y < canvas.height / 3) startGame(2); 
                else if (y < (canvas.height / 3) * 2) startGame(3); 
                else startGame(4); 
                return;
            }

            // Alternating thumb mechanic
            let side = (x < canvas.width / 2) ? 'left' : 'right';
            if (side !== lastTapSide) {
                speed += 2.0;
                if (speed > maxSpeed) speed = maxSpeed;
                lastTapSide = side;
            }
        }

        function triggerAction() {
            if (gameState === 3 && !actionTriggered && distance < 50) {
                actionTriggered = true;
                jumpVy = -11; 
                jumpScore = speed * 0.6 + (Math.random() * 0.5); 
            }
            if (gameState === 4 && !actionTriggered && distance < 50) {
                actionTriggered = true;
                javelinX = 100;
                javelinY = canvas.height / 2 + 10;
                javelinVy = -12;
                javelinSpeedX = speed * 1.5;
                jumpScore = speed * 5.0 + (Math.random() * 2.0);
                speed = 0; // Player stops to throw
            }
        }

        // Touch Listeners
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameOver) {
                gameState = 1; // Return to menu
                return;
            }
            for (let i = 0; i < e.changedTouches.length; i++) {
                touchStartY = e.changedTouches[i].clientY;
                handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let diffY = touchStartY - e.changedTouches[i].clientY;
                if (diffY > 40) { // Swipe Up Detected
                    triggerAction();
                }
            }
        }, { passive: false });

        // Mouse Fallback for Desktop Testing
        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            if (gameOver) {
                gameState = 1;
                return;
            }
            touchStartY = e.clientY;
            handleTap(e.clientX, e.clientY);
            isMouseDown = true;
        });
        canvas.addEventListener('mouseup', (e) => {
            if (isMouseDown) {
                let diffY = touchStartY - e.clientY;
                if (diffY > 40) triggerAction();
            }
            isMouseDown = false;
        });


        // Main Game Loop
        function update() {
            frameCount++;
            if (gameState >= 2 && !gameOver) {
                
                // Track visual movement
                if (!actionTriggered || gameState === 3) {
                    trackOffset -= speed;
                    if (trackOffset <= -40) trackOffset = 0;
                }

                // Event Logic
                if (gameState === 2) { // 100m Dash
                    speed *= 0.95; // Friction
                    distance += speed * 0.1;
                    runTimer += 1 / 60;
                    if (distance >= 100) {
                        gameOver = true;
                        resultScore = runTimer.toFixed(2) + "s";
                    }
                } 
                else if (gameState === 3) { // Long Jump
                    if (!actionTriggered) {
                        speed *= 0.96;
                        distance += speed * 0.1;
                        if (distance >= 50) {
                            gameOver = true;
                            resultScore = "FOUL!";
                        }
                    } else {
                        // Airborne
                        speed *= 0.98; // Less friction in air
                        distance += speed * 0.1; 
                        jumpY += jumpVy;
                        jumpVy += gravity;
                        if (jumpY >= 0) {
                            jumpY = 0;
                            gameOver = true;
                            resultScore = "Jumped: " + jumpScore.toFixed(2) + "m";
                        }
                    }
                } 
                else if (gameState === 4) { // Javelin
                    if (!actionTriggered) {
                        speed *= 0.96;
                        distance += speed * 0.1;
                        if (distance >= 50) {
                            gameOver = true;
                            resultScore = "FOUL!";
                        }
                    } else {
                        // Javelin in air
                        javelinX += javelinSpeedX;
                        javelinY += javelinVy;
                        javelinVy += gravity;
                        if (javelinY >= canvas.height / 2 + 50) {
                            gameOver = true;
                            resultScore = "Thrown: " + jumpScore.toFixed(2) + "m";
                        }
                    }
                }
            }
        }

        function draw() {
            // Background Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground Track
            ctx.fillStyle = '#c85a17';
            ctx.fillRect(0, canvas.height / 2 + 50, canvas.width, canvas.height / 2);

            // Horizon Line
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2 + 50);
            ctx.lineTo(canvas.width, canvas.height / 2 + 50);
            ctx.stroke();

            if (gameState === 0) {
                // Title
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 40px "Courier New"';
                ctx.fillText("8-BIT TRACK", canvas.width / 2, canvas.height / 3);
                ctx.font = '20px "Courier New"';
                ctx.fillText("Tap to Start", canvas.width / 2, canvas.height / 2 + 20);
            } 
            else if (gameState === 1) {
                // Menu
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 30px "Courier New"';
                ctx.fillText("SELECT EVENT", canvas.width / 2, canvas.height / 6 - 20);
                
                // Menu Buttons
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(20, canvas.height / 6, canvas.width - 40, canvas.height / 3 - 20);
                ctx.fillRect(20, canvas.height / 2, canvas.width - 40, canvas.height / 3 - 20);
                ctx.fillRect(20, (canvas.height / 6) * 5, canvas.width - 40, canvas.height / 6 - 20);

                ctx.fillStyle = '#fff';
                ctx.font = '24px "Courier New"';
                ctx.fillText("100m Dash", canvas.width / 2, canvas.height / 6 + (canvas.height / 6) - 10);
                ctx.fillText("Long Jump", canvas.width / 2, canvas.height / 2 + (canvas.height / 6) - 10);
                ctx.fillText("Javelin", canvas.width / 2, (canvas.height / 6) * 5 + (canvas.height / 12));
            } 
            else {
                // Moving Track Details
                for (let i = 0; i < canvas.width; i += 40) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(i + trackOffset, canvas.height / 2 + 65, 20, 4);
                    ctx.fillStyle = '#aa4c13';
                    ctx.fillRect(i + trackOffset + 10, canvas.height / 2 + 85, 20, 4);
                }

                // Foul Line (For Long Jump / Javelin)
                if (gameState === 3 || gameState === 4) {
                    let distanceLeft = 50 - distance;
                    let lineX = 100 + (distanceLeft * 20); // Scale distance visually
                    if (lineX < canvas.width && lineX > -100) {
                        ctx.fillStyle = 'red';
                        ctx.fillRect(lineX, canvas.height / 2 + 50, 10, canvas.height / 2);
                    }
                }

                // UI Overlay
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, 100);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.font = '18px "Courier New"';
                
                if (gameState === 2) {
                    ctx.fillText("100m Dash", 10, 25);
                    ctx.fillText("Dist: " + distance.toFixed(1) + "m / 100m", 10, 50);
                    ctx.fillText("Time: " + runTimer.toFixed(2) + "s", 10, 75);
                } else if (gameState === 3) {
                    ctx.fillText("Long Jump", 10, 25);
                    ctx.fillText("Runway: " + distance.toFixed(1) + "m / 50m", 10, 50);
                    ctx.fillStyle = 'yellow';
                    ctx.fillText("Swipe UP to Jump!", 10, 75);
                } else if (gameState === 4) {
                    ctx.fillText("Javelin", 10, 25);
                    ctx.fillText("Runway: " + distance.toFixed(1) + "m / 50m", 10, 50);
                    ctx.fillStyle = 'yellow';
                    ctx.fillText("Swipe UP to Throw!", 10, 75);
                }

                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.fillText("Spd: " + speed.toFixed(1), canvas.width - 10, 25);
                
                // Draw Thumb Input Overlay Zones (visual guide)
                ctx.globalAlpha = 0.1;
                ctx.fillStyle = (lastTapSide === 'right') ? '#fff' : '#000';
                ctx.fillRect(0, 100, canvas.width / 2, canvas.height - 100);
                ctx.fillStyle = (lastTapSide === 'left') ? '#fff' : '#000';
                ctx.fillRect(canvas.width / 2, 100, canvas.width / 2, canvas.height - 100);
                ctx.globalAlpha = 1.0;

                // Player Drawing
                let px = 100;
                let py = canvas.height / 2 + 10 + jumpY;
                
                // Leg animation toggle based on speed
                let legOffset = (Math.floor(frameCount / 4) % 2 === 0 && speed > 1) ? 10 : 0;
                
                // Player Body
                ctx.fillStyle = '#fff'; // White jersey
                ctx.fillRect(px, py, 16, 24);
                // Head
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(px + 2, py - 14, 12, 14);
                // Legs
                ctx.fillStyle = '#000';
                ctx.fillRect(px, py + 24, 6, 12 + legOffset);
                ctx.fillRect(px + 10, py + 24, 6, 12 - legOffset);

                // Draw Javelin
                if (gameState === 4 && actionTriggered) {
                    ctx.fillStyle = '#ccc';
                    ctx.fillRect(javelinX, javelinY, 40, 4);
                }

                // Game Over Screen
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    
                    ctx.font = 'bold 36px "Courier New"';
                    if (resultScore === "FOUL!") ctx.fillStyle = 'red';
                    ctx.fillText(resultScore === "FOUL!" ? "FOUL!" : "FINISHED!", canvas.width / 2, canvas.height / 2 - 30);
                    
                    if (resultScore !== "FOUL!") {
                        ctx.fillStyle = 'yellow';
                        ctx.font = '28px "Courier New"';
                        ctx.fillText("Score: " + resultScore, canvas.width / 2, canvas.height / 2 + 10);
                    }
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px "Courier New"';
                    ctx.fillText("- Tap Anywhere for Menu -", canvas.width / 2, canvas.height / 2 + 60);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Loop
        loop();
    </script>
</body>
</html>
