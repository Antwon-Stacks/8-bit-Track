<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Bit Track</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            touch-action: none; 
            font-family: 'Press Start 2P', monospace;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;

    function resize() {
        width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));
    resize();

    // App Navigation States
    // 'TITLE', 'MAIN_MENU', 'SINGLE_EVENT_MENU', 'LEADERBOARD', 'PLAYING', 'GAMEOVER', 'TRACK_MEET_SUMMARY'
    let state = 'TITLE';
    
    let selectedEventKey = '100M'; 
    let isTrackMeet = false;
    const trackMeetEvents = ['100M', 'HURDLES', 'LONG_JUMP', 'JAVELIN'];
    let currentMeetIndex = 0;
    let trackMeetScores = {};
    
    let gameOverDelay = 0;
    
    // Core Gameplay Variables
    let speed = 0;
    const maxSpeed = 16;
    let distance = 0;
    let time = 0;
    let resultScore = "";
    
    let lastTapSide = null;
    let activeTouches = { left: false, right: false };
    let touchStartY = 0;
    let actionTriggered = false;
    
    // Physics & Events
    let isJumping = false;
    let jumpY = 0;
    let jumpVy = 0;
    const gravity = 0.6;
    let jumpScore = 0;
    
    let javelinX = 0;
    let javelinY = 0;
    let javelinVy = 0;
    let javelinSpeedX = 0;
    
    let trackOffset = 0;
    let frameCount = 0;
    const hurdleDistances = [20, 40, 60, 80];

    // Local Leaderboard Storage mock
    let leaderboard = JSON.parse(localStorage.getItem('8bit_track_lb')) || {
        '100M': 'None',
        'HURDLES': 'None',
        'LONG_JUMP': 'None',
        'JAVELIN': 'None'
    };

    function saveScore(eventKey, scoreStr) {
        if (leaderboard[eventKey] === 'None' || scoreStr < leaderboard[eventKey]) {
            leaderboard[eventKey] = scoreStr;
            localStorage.setItem('8bit_track_lb', JSON.stringify(leaderboard));
        }
    }

    function drawText(text, x, y, size, color = "white", align = "center") {
        ctx.fillStyle = color;
        ctx.font = `${size}px 'Press Start 2P', monospace`;
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
    }

    function startGame(eventMode, isMeet = false) {
        selectedEventKey = eventMode;
        isTrackMeet = isMeet;
        state = 'PLAYING';
        
        speed = 0;
        distance = 0;
        time = 0;
        resultScore = "";
        lastTapSide = null;
        actionTriggered = false;
        isJumping = false;
        jumpY = 0;
        jumpVy = 0;
        jumpScore = 0;
        activeTouches = { left: false, right: false };
    }

    function triggerSwipeAction() {
        if (selectedEventKey === 'LONG_JUMP' && !actionTriggered && distance < 50) {
            actionTriggered = true;
            isJumping = true;
            jumpVy = -11; 
            jumpScore = (speed * 0.5) + (Math.random() * 0.5); 
        }
        if (selectedEventKey === 'JAVELIN' && !actionTriggered && distance < 50) {
            actionTriggered = true;
            javelinX = width * 0.3;
            javelinY = 0; 
            javelinVy = -12;
            javelinSpeedX = speed * 1.5;
            jumpScore = (speed * 4.5) + (Math.random() * 2.0);
            speed = 0; 
        }
    }

    function endEvent(scoreText) {
        state = 'GAMEOVER';
        resultScore = scoreText;
        gameOverDelay = 1.5; 
        
        if (isTrackMeet) {
            trackMeetScores[selectedEventKey] = scoreText;
        } else {
            saveScore(selectedEventKey, scoreText);
        }
    }

    // --- Input Handling ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        let t = e.changedTouches[0];
        let touchY = t.clientY;
        let touchX = t.clientX;

        if (state === 'TITLE') {
            state = 'MAIN_MENU';
            return;
        }

        if (state === 'MAIN_MENU') {
            let step = height / 4;
            let btnY = height * 0.3;
            
            // Single Event Button
            if (touchY >= btnY && touchY < btnY + step) {
                state = 'SINGLE_EVENT_MENU';
            }
            // Track Meet Button
            else if (touchY >= btnY + step && touchY < btnY + step * 2) {
                currentMeetIndex = 0;
                trackMeetScores = {};
                startGame(trackMeetEvents[currentMeetIndex], true);
            }
            // Leaderboard Button
            else if (touchY >= btnY + step * 2 && touchY < btnY + step * 3) {
                state = 'LEADERBOARD';
            }
            return;
        }

        if (state === 'SINGLE_EVENT_MENU') {
            let step = height / 6;
            let startY = height * 0.25;
            
            if (touchY >= startY && touchY < startY + step) startGame('100M', false);
            else if (touchY >= startY + step && touchY < startY + step * 2) startGame('HURDLES', false);
            else if (touchY >= startY + step * 2 && touchY < startY + step * 3) startGame('LONG_JUMP', false);
            else if (touchY >= startY + step * 3 && touchY < startY + step * 4) startGame('JAVELIN', false);
            else if (touchY >= startY + step * 4) state = 'MAIN_MENU'; // Back button
            return;
        }

        if (state === 'LEADERBOARD') {
            state = 'MAIN_MENU';
            return;
        }

        if (state === 'GAMEOVER') {
            if (gameOverDelay > 0) return; 
            
            if (isTrackMeet) {
                currentMeetIndex++;
                if (currentMeetIndex < trackMeetEvents.length) {
                    startGame(trackMeetEvents[currentMeetIndex], true);
                } else {
                    state = 'TRACK_MEET_SUMMARY';
                }
            } else {
                state = 'MAIN_MENU';
            }
            return;
        }

        if (state === 'TRACK_MEET_SUMMARY') {
            state = 'MAIN_MENU';
            return;
        }

        if (state === 'PLAYING') {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                touchStartY = touch.clientY;
                let side = (touch.clientX < width / 2) ? 'left' : 'right';
                activeTouches[side] = true;

                if (selectedEventKey === 'HURDLES' && activeTouches['left'] && activeTouches['right'] && !isJumping) {
                    isJumping = true;
                    jumpVy = -11;
                } 
                else if (!isJumping && !actionTriggered) {
                    if (side !== lastTapSide) {
                        speed += 2.2;
                        if (speed > maxSpeed) speed = maxSpeed;
                        lastTapSide = side;
                    }
                }
            }
        }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (state === 'PLAYING') {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let side = (touch.clientX < width / 2) ? 'left' : 'right';
                activeTouches[side] = false;

                let diffY = touchStartY - touch.clientY;
                if (diffY > 40) triggerSwipeAction();
            }
        }
    }, { passive: false });


    // --- Game Loop ---
    function update() {
        frameCount++;
        
        if (state === 'GAMEOVER' && gameOverDelay > 0) {
            gameOverDelay -= 1/60;
        }

        if (state === 'PLAYING') {
            if (!actionTriggered || selectedEventKey === 'LONG_JUMP') {
                trackOffset -= speed;
                if (trackOffset <= -40) trackOffset = 0;
            }

            if (isJumping) {
                jumpY += jumpVy;
                jumpVy += gravity;
                if (jumpY >= 0) {
                    jumpY = 0;
                    isJumping = false;
                }
            }

            if (selectedEventKey === '100M') {
                speed *= 0.95; 
                distance += speed * 0.1;
                time += 1 / 60;
                if (distance >= 100) endEvent(`${time.toFixed(2)}s`);
            } 
            else if (selectedEventKey === 'HURDLES') {
                speed *= 0.95;
                distance += speed * 0.1;
                time += 1 / 60;
                
                hurdleDistances.forEach(h => {
                    if (distance >= h - 0.5 && distance <= h + 0.5 && jumpY > -15) {
                        speed *= 0.4; 
                    }
                });

                if (distance >= 100) endEvent(`${time.toFixed(2)}s`);
            }
            else if (selectedEventKey === 'LONG_JUMP') {
                if (!actionTriggered) {
                    speed *= 0.96;
                    distance += speed * 0.1;
                    if (distance >= 50) endEvent("FOUL!");
                } else {
                    speed *= 0.98; 
                    distance += speed * 0.1; 
                    if (!isJumping) endEvent(`${jumpScore.toFixed(2)}m`);
                }
            } 
            else if (selectedEventKey === 'JAVELIN') {
                if (!actionTriggered) {
                    speed *= 0.96;
                    distance += speed * 0.1;
                    if (distance >= 50) endEvent("FOUL!");
                } else {
                    javelinX += javelinSpeedX;
                    javelinY += javelinVy;
                    javelinVy += gravity;
                    if (javelinY >= 0) endEvent(`${jumpScore.toFixed(2)}m`);
                }
            }
        }
    }

    function draw8BitPlayer(px, py) {
        let legOffset = (Math.floor(frameCount / 4) % 2 === 0 && speed > 1 && !isJumping) ? 8 : 0;
        
        ctx.fillStyle = 'white';
        ctx.fillRect(px, py, 20, 28);
        ctx.fillStyle = '#ffcc99'; 
        ctx.fillRect(px + 2, py - 16, 16, 16);
        ctx.fillStyle = 'black'; 
        ctx.fillRect(px, py + 28, 8, 14 + legOffset);
        ctx.fillRect(px + 12, py + 28, 8, 14 - legOffset);
    }

    function draw() {
        ctx.fillStyle = '#33ccff';
        ctx.fillRect(0, 0, width, height);

        let horizonY = height * 0.6;
        ctx.fillStyle = '#c85a17';
        ctx.fillRect(0, horizonY, width, height - horizonY);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.stroke();

        // 1. Title Screen State
        if (state === 'TITLE') {
            drawText("8-BIT TRACK", width/2, height * 0.35, 32, "#FFD700");
            drawText("Tap Anywhere to Start", width/2, height * 0.55, 14, "#FFFFFF");
        }
        
        // 2. Main Menu State
        else if (state === 'MAIN_MENU') {
            drawText("8-BIT TRACK", width/2, height * 0.15, 26, "#FFD700");
            
            let step = height / 5;
            let btnY = height * 0.3;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(30, btnY, width - 60, step - 10);
            ctx.fillRect(30, btnY + step, width - 60, step - 10);
            ctx.fillRect(30, btnY + step * 2, width - 60, step - 10);
            
            drawText("Single Event", width/2, btnY + (step / 2), 16);
            drawText("Track Meet", width/2, btnY + step + (step / 2), 16);
            drawText("Leaderboard", width/2, btnY + step * 2 + (step / 2), 16);
        }

        // 3. Single Event Selection Menu
        else if (state === 'SINGLE_EVENT_MENU') {
            drawText("SELECT EVENT", width/2, height * 0.12, 22, "#FFD700");
            
            let step = height / 6;
            let startY = height * 0.22;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(30, startY, width - 60, step - 10);
            ctx.fillRect(30, startY + step, width - 60, step - 10);
            ctx.fillRect(30, startY + step * 2, width - 60, step - 10);
            ctx.fillRect(30, startY + step * 3, width - 60, step - 10);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(30, startY + step * 4, width - 60, step - 10);

            drawText("100m Dash", width/2, startY + (step / 2), 14);
            drawText("Hurdles", width/2, startY + step + (step / 2), 14);
            drawText("Long Jump", width/2, startY + step * 2 + (step / 2), 14);
            drawText("Javelin", width/2, startY + step * 3 + (step / 2), 14);
            drawText("Back", width/2, startY + step * 4 + (step / 2), 14, "#FFD700");
        }

        // 4. Leaderboard State
        else if (state === 'LEADERBOARD') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, width, height);

            drawText("LEADERBOARD", width/2, height * 0.15, 24, "#FFD700");
            
            let startY = height * 0.35;
            let spacing = height * 0.1;

            drawText(`100m Dash:  ${leaderboard['100M']}`, width/2, startY, 12, "white");
            drawText(`Hurdles:    ${leaderboard['HURDLES']}`, width/2, startY + spacing, 12, "white");
            drawText(`Long Jump:  ${leaderboard['LONG_JUMP']}`, width/2, startY + spacing * 2, 12, "white");
            drawText(`Javelin:    ${leaderboard['JAVELIN']}`, width/2, startY + spacing * 3, 12, "white");

            drawText("- Tap to return -", width/2, height * 0.85, 10, "#AAAAAA");
        }

        // 5. Gameplay & Game Over States
        else if (state === 'PLAYING' || state === 'GAMEOVER') {
            for (let i = 0; i < width; i += 40) {
                ctx.fillStyle = 'white';
                ctx.fillRect(i + trackOffset, horizonY + 20, 20, 4);
                ctx.fillStyle = '#aa4c13';
                ctx.fillRect(i + trackOffset + 10, horizonY + 50, 20, 4);
            }

            if (selectedEventKey === 'HURDLES') {
                hurdleDistances.forEach(h => {
                    let hx = width * 0.3 + ((h - distance) * 20); 
                    if (hx > -50 && hx < width + 50) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(hx, horizonY + 20, 10, 40); 
                        ctx.fillStyle = 'red';
                        ctx.fillRect(hx - 5, horizonY + 15, 20, 10); 
                    }
                });
            }

            if (selectedEventKey === 'LONG_JUMP' || selectedEventKey === 'JAVELIN') {
                let lineX = width * 0.3 + ((50 - distance) * 20);
                if (lineX < width && lineX > -100) {
                    ctx.fillStyle = 'red';
                    ctx.fillRect(lineX, horizonY, 12, height - horizonY);
                }
            }

            // Top UI Dashboard
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, width, 80);
            
            if (isTrackMeet) {
                drawText(`Meet Event ${currentMeetIndex + 1}/4`, width/2, 20, 10, "#FFD700");
            }

            if (selectedEventKey === '100M' || selectedEventKey === 'HURDLES') {
                drawText(`Dist: ${distance.toFixed(1)}/100m`, 10, 40, 12, "white", "left");
                drawText(`Time: ${time.toFixed(2)}s`, 10, 65, 12, "white", "left");
            } else {
                drawText(`Runway: ${distance.toFixed(1)}/50m`, 10, 40, 12, "white", "left");
                let hint = selectedEventKey === 'LONG_JUMP' ? "Swipe UP to Jump!" : "Swipe UP to Throw!";
                drawText(hint, 10, 65, 12, "yellow", "left");
            }

            drawText(`Spd: ${speed.toFixed(1)}`, width - 10, 40, 12, "white", "right");

            // Touch indicators
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = (lastTapSide === 'right') ? 'white' : 'black';
            ctx.fillRect(0, 80, width / 2, height - 80);
            ctx.fillStyle = (lastTapSide === 'left') ? 'white' : 'black';
            ctx.fillRect(width / 2, 80, width / 2, height - 80);
            ctx.globalAlpha = 1.0;

            if (selectedEventKey === 'JAVELIN' && actionTriggered) {
                ctx.fillStyle = '#DDDDDD';
                ctx.fillRect(javelinX, horizonY - 20 + javelinY, 50, 4);
            }

            draw8BitPlayer(width * 0.3, horizonY - 40 + jumpY);
            
            if (selectedEventKey === 'HURDLES' && !isJumping) {
                drawText("PRESS BOTH THUMBS TO JUMP!", width/2, height * 0.47, 10, "rgba(51, 204, 255, 0.9)");
            }

            if (state === 'GAMEOVER') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, width, height);
                
                let titleColor = resultScore === "FOUL!" ? "#FF0000" : "#00FF00";
                let titleText = resultScore === "FOUL!" ? "FOUL!" : "FINISHED!";
                
                drawText(titleText, width/2, height * 0.4, 28, titleColor);
                if (resultScore !== "FOUL!") {
                    drawText(`Score: ${resultScore}`, width/2, height * 0.55, 18, "#FFD700");
                }
                
                if (gameOverDelay <= 0) {
                    let promptText = isTrackMeet ? "- Tap for Next Event -" : "- Tap for Menu -";
                    drawText(promptText, width/2, height * 0.8, 12, "#AAAAAA");
                }
            }
        }

        // 6. Track Meet Summary
        else if (state === 'TRACK_MEET_SUMMARY') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
            ctx.fillRect(0, 0, width, height);

            drawText("TRACK MEET COMPLETE!", width/2, height * 0.2, 18, "#FFD700");
            
            let startY = height * 0.4;
            let spacing = height * 0.1;
            
            drawText(`100m Dash: ${trackMeetScores['100M'] || "N/A"}`, width/2, startY, 12);
            drawText(`Hurdles:   ${trackMeetScores['HURDLES'] || "N/A"}`, width/2, startY + spacing, 12);
            drawText(`Long Jump: ${trackMeetScores['LONG_JUMP'] || "N/A"}`, width/2, startY + spacing * 2, 12);
            drawText(`Javelin:   ${trackMeetScores['JAVELIN'] || "N/A"}`, width/2, startY + spacing * 3, 12);
            
            drawText("- Tap to return to Menu -", width/2, height * 0.9, 10, "#AAAAAA");
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
